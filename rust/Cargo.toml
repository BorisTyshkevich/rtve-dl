[package]
name = "rtve-dl-rust"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[[bin]]
name = "rtve"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip", "brotli", "deflate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
strsim = "0.11"
hound = "3.5"
time = { version = "0.3", features = ["formatting", "local-offset"] }
whisper-rs = { version = "0.15.1", features = ["metal"] }

[dev-dependencies]
tempfile = "3.15"
